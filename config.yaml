# Runtime settings

runtime:
  browser:
    headless: true
    timeout: 30000
    args:
      - '--disable-extensions'

  delays:
    min: 2
    max: 4

  max_usernames_per_search: 100
  max_posts_to_inspect_per_hashtag: 20
  max_scrolls_per_page: 5
  max_retries: 3
  retry_delay: 5
