# Instagram Influencer Username Discovery Configuration
# Define niches, target counts, initial hashtags, search queries, and runtime settings

niches:
  technology:
    target: 250
    initial_hashtags:
      - '#technology'
      - '#tech'
      - '#technews'
      - '#gadgets'
      - '#programming'
      - '#coding'
      - '#artificialintelligence'
    search_queries:
      - 'technology influencers'
      - 'tech influencers under 1M followers'
